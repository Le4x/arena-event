# Arena Event - Nginx Configuration for Production with Load Balancing
# This configuration supports multiple API instances with sticky sessions

# Upstream for API with sticky sessions (ip_hash for WebSocket compatibility)
upstream arena_api_backend {
    ip_hash; # Ensures same client always goes to same server instance
    server localhost:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# API Server
server {
    listen 80;
    server_name api.arena-event.fr;

    # Increase timeouts for long-polling and WebSocket connections
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;

    # WebSocket and Socket.IO support
    location / {
        proxy_pass http://arena_api_backend;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Standard proxy headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering settings for real-time data
        proxy_buffering off;
        proxy_request_buffering off;

        # Keepalive
        proxy_set_header Connection "";
    }

    # Socket.io specific path (if needed)
    location /socket.io/ {
        proxy_pass http://arena_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
}

# Admin Dashboard
server {
    listen 80;
    server_name admin.arena-event.fr;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

