version: '3.8'

services:
  # ============================================
  # Database Services
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: arena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-arena}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arena123}
      POSTGRES_DB: ${DB_NAME:-arena_event}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arena-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-arena}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arena-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - arena-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend Services
  # ============================================
  simple-api:
    build:
      context: ./simple-api
      dockerfile: Dockerfile
    container_name: arena-simple-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-arena}:${DB_PASSWORD:-arena123}@postgres:5432/${DB_NAME:-arena_event}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      SIMPLE_API_UPLOAD_TOKEN: ${UPLOAD_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - media_data:/app/media
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - arena-network
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: arena-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-arena}:${DB_PASSWORD:-arena123}@postgres:5432/${DB_NAME:-arena_event}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arena-network

  # ============================================
  # Frontend Services
  # ============================================
  web-admin:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-https://api.arena-event.fr}
        NEXT_PUBLIC_WS_URL: ${WS_URL:-https://ws.arena-event.fr}
    container_name: arena-web-admin
    restart: unless-stopped
    ports:
      - '3002:3000'
    networks:
      - arena-network

  web-player:
    build:
      context: .
      dockerfile: apps/web-player/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-https://api.arena-event.fr}
        NEXT_PUBLIC_WS_URL: ${WS_URL:-https://ws.arena-event.fr}
    container_name: arena-web-player
    restart: unless-stopped
    ports:
      - '3003:3000'
    networks:
      - arena-network

  web-screen:
    build:
      context: .
      dockerfile: apps/web-screen/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-https://api.arena-event.fr}
        NEXT_PUBLIC_WS_URL: ${WS_URL:-https://ws.arena-event.fr}
        NEXT_PUBLIC_PLAYER_URL: ${PLAYER_URL:-https://player.arena-event.fr}
    container_name: arena-web-screen
    restart: unless-stopped
    ports:
      - '3004:3000'
    networks:
      - arena-network

  web-studio:
    build:
      context: .
      dockerfile: apps/web-studio/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-https://api.arena-event.fr}
        NEXT_PUBLIC_WS_URL: ${WS_URL:-https://ws.arena-event.fr}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_URL:-https://admin.arena-event.fr}
        NEXT_PUBLIC_PLAYER_URL: ${PLAYER_URL:-https://player.arena-event.fr}
        NEXT_PUBLIC_SCREEN_URL: ${SCREEN_URL:-https://screen.arena-event.fr}
    container_name: arena-web-studio
    restart: unless-stopped
    ports:
      - '3005:3000'
    networks:
      - arena-network

  # ============================================
  # Reverse Proxy (Nginx)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: arena-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - media_data:/var/www/media:ro
    depends_on:
      - simple-api
      - web-admin
      - web-player
      - web-screen
      - web-studio
    networks:
      - arena-network

  # SSL Certificate Manager (optional)
  certbot:
    image: certbot/certbot
    container_name: arena-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  arena-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
