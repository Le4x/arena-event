# Configuration Nginx pour Arena Event
# Copier ce fichier dans /etc/nginx/sites-available/arena-event
# Puis créer le lien symbolique: sudo ln -s /etc/nginx/sites-available/arena-event /etc/nginx/sites-enabled/

# Landing Page - Domaine principal
server {
    listen 80;
    listen [::]:80;
    server_name arena-event.fr www.arena-event.fr;

    location / {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

