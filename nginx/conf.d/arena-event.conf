# ============================================
# Arena Event - Nginx Configuration
# ============================================
# Replace YOUR_DOMAIN with your actual domain

# Upstream definitions
upstream simple-api {
    server simple-api:3000;
    keepalive 32;
}

upstream web-admin {
    server web-admin:3000;
}

upstream web-player {
    server web-player:3000;
}

upstream web-screen {
    server web-screen:3000;
}

upstream web-studio {
    server web-studio:3000;
}

# ============================================
# API Server (api.YOUR_DOMAIN)
# Handles REST API endpoints
# ============================================
server {
    listen 80;
    server_name api.arena-event.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.arena-event.fr;

    ssl_certificate /etc/letsencrypt/live/arena-event.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arena-event.fr/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    client_max_body_size 100M;

    location / {
        proxy_pass http://simple-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media files
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ============================================
# WebSocket Server (ws.YOUR_DOMAIN)
# Handles Socket.io connections
# ============================================
server {
    listen 80;
    server_name ws.arena-event.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ws.arena-event.fr;

    ssl_certificate /etc/letsencrypt/live/arena-event.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arena-event.fr/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    location / {
        proxy_pass http://simple-api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket specific settings
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
}

